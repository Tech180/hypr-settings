# Seeded by Home Manager (kanshi.nix). Runtime copy lives under AGS state.
# Laptop left, then two landscape 1080p Dells (match by description).
profile home {
  output "eDP-1" enable mode 1920x1080@60 position 0,0 scale 1 transform normal
  output "Dell Inc. DELL P2422H B95JF04" enable mode 1920x1080@60 position 1920,0 scale 1 transform normal
  output "Dell Inc. DELL P2422H 9BWHF04" enable mode 1920x1080@60 position 3840,0 scale 1 transform normal
}

profile portable {
  output "eDP-1" enable mode 1920x1080@60 position 0,0 scale 1.5 transform normal
}

profile asia {
  output "eDP-1" enable mode 1920x1080@60 position 0,0 scale 1 transform normal
  output "DP-3" enable mode 1680x1050@60 position 1920,0 scale 1
}

profile docked {
  output "eDP-1" enable mode 1920x1080@60 position 0,0 scale 1 transform normal
  ...output "*" enable mode 1920x1080@60 scale 1
}

profile default {
  output "*" scale 1
}
